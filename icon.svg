<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Inner subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" />

  <!-- Main Marketplace & Commercial Building Glyph -->
  <g filter="url(#shadow)" transform="translate(40, 20)">
    <!-- Roof / Pediment canopy -->
    <path d="M 80 170 L 216 90 L 352 170 Z" fill="url(#accent)" />
    <!-- Market Canopy Stripes/Detail -->
    <path d="M 100 170 L 140 170 L 150 200 L 90 200 Z" fill="#ffffff" opacity="0.9" />
    <path d="M 160 170 L 200 170 L 205 200 L 155 200 Z" fill="#f59e0b" />
    <path d="M 220 170 L 260 170 L 265 200 L 215 200 Z" fill="#ffffff" opacity="0.9" />
    <path d="M 280 170 L 320 170 L 330 200 L 275 200 Z" fill="#f59e0b" />

    <!-- Main Building Columns & Structure -->
    <rect x="96" y="210" width="240" height="150" rx="8" fill="#ffffff" />
    
    <!-- Windows & Arched Doors -->
    <!-- Column 1 Door (Shop 1) -->
    <rect x="116" y="270" width="40" height="90" rx="4" fill="#312e81" />
    <rect x="120" y="230" width="32" height="24" rx="3" fill="#6366f1" opacity="0.4" />

    <!-- Column 2 Door (Shop 2) -->
    <rect x="176" y="270" width="40" height="90" rx="4" fill="#312e81" />
    <rect x="180" y="230" width="32" height="24" rx="3" fill="#6366f1" opacity="0.4" />

    <!-- Column 3 Door (Shop 3) -->
    <rect x="236" y="270" width="40" height="90" rx="4" fill="#312e81" />
    <rect x="240" y="230" width="32" height="24" rx="3" fill="#6366f1" opacity="0.4" />

    <!-- Column 4 Door (Shop 4) -->
    <rect x="296" y="270" width="40" height="90" rx="4" fill="#312e81" />
    <rect x="300" y="230" width="32" height="24" rx="3" fill="#6366f1" opacity="0.4" />

    <!-- Ground base plate -->
    <rect x="76" y="360" width="280" height="14" rx="4" fill="url(#accent)" />
  </g>

  <!-- Typography Monogram MM -->
  <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#ffffff">
    MAHALAXMI
  </text>
  <text x="256" y="475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" letter-spacing="6" fill="#fbbf24">
    MARKET
  </text>
</svg>
